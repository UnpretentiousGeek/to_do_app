<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo App</title><script defer="defer" src="main.js"></script></head><body><div class="sidebar"><button command="show-modal" commandfor="addProject" class="newProject"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H240q-17 0-28.5-11.5T200-480q0-17 11.5-28.5T240-520h200v-200q0-17 11.5-28.5T480-760q17 0 28.5 11.5T520-720v200h200q17 0 28.5 11.5T760-480q0 17-11.5 28.5T720-440H520v200q0 17-11.5 28.5T480-200q-17 0-28.5-11.5T440-240v-200Z"/></svg> New Project</button><dialog id="addProject"><form id="projectDetails"><div><label for="projectName">Project Name</label> <input name="projectName" id="projectName" required></div><button type="submit">Submit</button></form><button commandfor="addProject" command="close">Close</button></dialog><div class="projects"><div class="projectHeading">Projects</div><div class="projectList"></div></div></div><div class="newTask"><button command="show-modal" commandfor="addTodo" class="newTodo"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H240q-17 0-28.5-11.5T200-480q0-17 11.5-28.5T240-520h200v-200q0-17 11.5-28.5T480-760q17 0 28.5 11.5T520-720v200h200q17 0 28.5 11.5T760-480q0 17-11.5 28.5T720-440H520v200q0 17-11.5 28.5T480-200q-17 0-28.5-11.5T440-240v-200Z"/></svg> New Task</button><dialog id="addTodo"><form id="todoDetails"><div><label for="todoTitle">Title</label> <input name="todoTitle" id="todoTitle" required></div><div><label for="description">Description</label> <textarea id="description" name="description" rows="4" cols="50"></textarea></div><div><label for="dueDate">Due Date</label> <input type="date" id="start" name="dueDate"></div><div><label for="priority">Read</label> <select name="priority" id="priority"><option value="high">High</option><option
